# ─────────────────────────────────────────────
# Terminal
# ─────────────────────────────────────────────

# Tell applications inside tmux that we support 256 colors.
set -g default-terminal "tmux-256color"

# Pass through true-color capability when supported.
#set -as terminal-features ",*:RGB"


# ─────────────────────────────────────────────
# Shell
# ─────────────────────────────────────────────

# Use Bash.
set -g default-shell /bin/bash


# ─────────────────────────────────────────────
# History / Scrollback
# ─────────────────────────────────────────────

set -g history-limit 100000


# ─────────────────────────────────────────────
# Mouse
# ─────────────────────────────────────────────

#set -g mouse on


# ─────────────────────────────────────────────
# Windows
# ─────────────────────────────────────────────

# Start numbering at 1.
set -g base-index 1

# Automatically renumber windows after one is closed.
set -g renumber-windows on


# ─────────────────────────────────────────────
# Status bar
# ─────────────────────────────────────────────

set -g status-position bottom
set -g status-interval 5

# Keep the status bar simple.
set -g status-left " #S "
set -g status-right " %Y-%m-%d %H:%M "


# ─────────────────────────────────────────────
# Miscellaneous
# ─────────────────────────────────────────────

# Don't display the default tmux startup message.
set -g display-time 2000

# Allow applications to set the terminal title.
set -g set-titles on
set -g set-titles-string "#S:#I:#W"


# ─────────────────────────────────────────────
# Prefix
# ─────────────────────────────────────────────

# Keep the normal Ctrl-b prefix.
# This means you don't have to learn a new keybinding.
